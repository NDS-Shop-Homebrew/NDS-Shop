name: Build NDS-Shop (3DS)

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests hôtes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parseur de catalogue
        run: make -C tests/host

  build:
    name: Build 3DS (devkitARM)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Environnement
        run: git config --global safe.directory '*'
      - name: Installer bannertool et makerom
        run: |
          apt-get update
          apt-get install -y p7zip-full

          curl -L https://github.com/Epicpkmn11/bannertool/releases/latest/download/bannertool.zip -o bannertool.zip
          7z e bannertool.zip linux-x86_64/bannertool
          chmod +x bannertool
          mv bannertool /usr/local/bin
          rm bannertool.zip

          curl -L https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.17/makerom-v0.17-ubuntu_x86_64.zip -o makerom.zip
          7z e makerom.zip makerom
          chmod +x makerom
          mv makerom /usr/local/bin
          rm makerom.zip
      - name: Compiler (.3dsx et .cia)
        run: |
          make
          make cia
          mkdir -p artifacts
          cp NDS-Shop.3dsx artifacts/
          cp NDS-Shop.cia artifacts/
      - name: Publier l'artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: nds-shop-3ds
          path: artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [tests, build]
    permissions:
      contents: write
    name: Publier la version
    steps:
      - name: Récupérer l'artefact
        uses: actions/download-artifact@v4
        with:
          name: nds-shop-3ds
          path: build
      - name: Créer la version GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true
